send_command:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: lomi
    command:
      required: true
      selector:
        select:
          options:
            - start
            - pause
            - resume
            - stop
            - prog
          translation_key: command
    mode:
      required: false
      selector:
        select:
          options:
            - grow
            - express
            - lomi_approved
            - cleaning
          translation_key: mode
    start_at:
      required: false
      selector:
        datetime:

schedule_start:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: lomi
    start_at:
      required: true
      selector:
        datetime:
    mode:
      required: false
      selector:
        select:
          options:
            - grow
            - express
            - lomi_approved
            - cleaning
          translation_key: mode

cancel_scheduled:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: lomi
    command_id:
      required: false
      selector:
        text:

register_device:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: lomi
    serial_number:
      required: true
      example: L3GBA0625000514
      selector:
        text:
    nickname:
      required: false
      default: Lomi
      selector:
        text:
